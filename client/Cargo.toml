[package]
name = "client"
version = "2.0.0-alpha.6"
edition = "2024"

[dependencies]
remote_core = { path = "../remote_core" }
remote_platform = { path = "../remote_platform" }
protocol = { path = "../protocol" }
tokio = { version = "1.52.2", features = ["full"] }
async-trait = "0.1.89"
cpal = "0.17.3"
opus = "0.3.1"
crossbeam-channel = "0.5.15"
rand = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
rfd = "0.15"
wgpu = { version = "0.19", features = ["hal"] }
metal = "0.27"
objc = "0.2"
winit = "0.29"
video-toolbox-sys = "0.2.0"
core-media-sys = "0.1"
gpui-ce = { version = "0.3.3", features = ["runtime_shaders"] }
yororen_ui = "0.2"
core-video-sys = "0.1.4"
core-foundation = "0.10.0"
core-video = "0.4.3"

[features]
native-linux-video = ["dep:gpui-ce", "dep:anyhow", "dep:libc"]
native-windows-video = ["dep:windows", "dep:anyhow", "dep:gpui-ce"]

[target.'cfg(target_os = "windows")'.dependencies]
gpui-ce = { version = "0.3.3", optional = true, features = ["native-video"] }
anyhow = { version = "1", optional = true }
windows = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_Media_MediaFoundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D10", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

[target.'cfg(target_os="linux")'.dependencies]
gpui-ce = { version="0.3.3", optional=true, features=["native-video"] }
anyhow = {version="1",optional=true}
libc = {version="0.2",optional=true}
