name: macOS installation diagnostics
on:
  push:
    paths:
      - scripts/diagnose_macos_installation.py
      - scripts/tests/test_macos_installation_diagnostics.py
      - .github/workflows/macos-installation-diagnostics.yml
  pull_request:
    paths:
      - scripts/diagnose_macos_installation.py
      - scripts/tests/test_macos_installation_diagnostics.py
      - .github/workflows/macos-installation-diagnostics.yml
permissions:
  contents: read
jobs:
  read-only-diagnostics:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -p test_macos_installation_diagnostics.py -v
