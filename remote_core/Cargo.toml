[package]
name = "remote_core"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
bincode = "1.3.3"
tokio = { version = "1", features = ["full"] }
quanta = "0.12"
protocol = { path = "../protocol" }
rand = "0.10.1"
socket2 = "0.6.3"
hmac = "0.12.1"
sha2 = "0.10.9"
bytes = "1.11.1"
futures-util = { version = "0.3.32", features = ["sink"] }
rustls = { version = "0.23", features = ["ring"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
