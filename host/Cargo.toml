[package]
name = "host"
version = "2.0.0-alpha.6"
edition = "2024"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dependencies]
remote_core = { path = "../remote_core" }
remote_platform = { path = "../remote_platform" }
protocol = { path = "../protocol" }
tokio = { version = "1.52.2", features = ["full"] }
async-trait = "0.1.89"
cpal = "0.17.3"
opus = "0.3.1"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "=0.13.2", default-features = false }
pipewire = { version = "=0.10.1", features = ["v0_3_65"] }
zbus = { version = "=5.15.0", default-features = false, features = ["async-io"] }
futures-util = "=0.3.32"
serde = { version = "=1.0.228", features = ["derive"] }

[target.'cfg(unix)'.dev-dependencies]
zbus = { version = "=5.15.0", default-features = false, features = ["async-io"] }
futures-util = "=0.3.32"
serde = { version = "=1.0.228", features = ["derive"] }

[dev-dependencies]
x11rb = { version = "=0.13.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "1.5.4", features = ["macos_14_2"] }
core-graphics = { version = "0.23", features = ["highsierra", "elcapitan"] }
video-toolbox-sys = "0.2.0"
core-foundation = "0.10"
core-media-rs = "0.1"
core-media-sys = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Graphics_Gdi",
] }
