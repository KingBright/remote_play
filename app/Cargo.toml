[package]
name = "remote_play_app"
version = "0.1.0"
edition = "2024"

[dependencies]
client = { path = "../client" }
host = { path = "../host" }
protocol = { path = "../protocol" }
remote_core = { path = "../remote_core" }
tokio = { version = "1.52.2", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
rustls = { version = "0.23", features = ["ring"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui-ce = { version = "0.3.3", features = ["runtime_shaders"] }
yororen_ui = "0.2"
rfd = "0.15"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSAppearance"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-ce = { version = "0.3.3", features = ["runtime_shaders", "test-support"] }

[[bin]]
name = "remote_play"
path = "src/main.rs"
