[package]
name = "remote_client_bridge"
version = "0.1.0"
edition = "2024"

[lib]
name = "remote_play_android"
crate-type = ["rlib", "cdylib"]

[features]
default = []
android = ["jni"]
wasm = ["wasm-bindgen", "js-sys", "web-sys"]

[dependencies]
protocol = { path = "../protocol" }
remote_core = { path = "../remote_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
async-trait = "0.1"

# Android JNI dependencies
jni = { version = "0.21.1", optional = true }

# WebAssembly dependencies
wasm-bindgen = { version = "0.2.100", optional = true }
js-sys = { version = "0.3.77", optional = true }
web-sys = { version = "0.3.77", optional = true, features = [
    "Window",
    "Document",
    "WebSocket",
    "MessageEvent",
    "ErrorEvent",
    "BinaryType",
    "Performance",
    "CanvasRenderingContext2d",
    "HtmlCanvasElement"
] }
